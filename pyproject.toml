[project]
name = "odju"
version = "0.1.0"
description = "Audit d'exposition numérique en console, assisté par IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "dnspython>=2.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
odju = "odju.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odju"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
